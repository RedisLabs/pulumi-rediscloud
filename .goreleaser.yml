version: 2

# sdk/vX.Y.Z tags are not provider versions. Ignore them so snapshot builds
# resolve the vX.Y.Z tag.
git:
  ignore_tags:
    - sdk/*

archives:
  - id: archive
    name_template: "{{ .Binary }}-{{ .Tag }}-{{ .Os }}-{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

before:
  hooks:
    - make tfgen

builds:
  - binary: pulumi-resource-rediscloud
    dir: provider
    env:
      - CGO_ENABLED=0
    goarch:
      - amd64
      - arm64
    goos:
      - darwin
      - windows
      - linux
    ldflags:
      # The line below MUST align with the module in current provider/go.mod
      - -X github.com/RedisLabs/pulumi-rediscloud/provider/pkg/version.Version={{.Tag}}
    main: ./cmd/pulumi-resource-rediscloud/

changelog:
  disable: true

release:
  disable: false
  prerelease: auto

snapshot:
  version_template: "{{ .Version }}-SNAPSHOT"
